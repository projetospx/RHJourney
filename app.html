<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shopee Journey</title>

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

  <link rel="stylesheet" href="css/theme-fix.css">
  <link rel="stylesheet" href="css/structure-safe.css?v=20260829-1">
  <link rel="stylesheet" href="css/indicator-details.css?v=20260829-1">
</head>

<body class="app-body">

  <!-- ======================================================
       SIDEBAR
  ======================================================= -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebar-brand">
      <div class="sidebar-logo">
        S
      </div>

      <div class="sidebar-brand-text">
        <strong>
          Shopee Journey
        </strong>

        <span>
          People Journey
        </span>
      </div>
    </div>


    <nav class="sidebar-menu">

      <button
        class="menu-item active"
        data-page="dashboard"
        type="button"
      >
        <span>⌂</span>
        Visão Geral
      </button>

      <button
        class="menu-item admin-only"
        data-page="new-employees"
        type="button"
      >
        <span>＋</span>
        Novos Colaboradores
      </button>

      <button
        class="menu-item management-view"
        data-page="employees"
        type="button"
      >
        <span>👤</span>
        Colaboradores
      </button>

      <button
        class="menu-item"
        data-page="journeys"
        type="button"
      >
        <span>↗</span>
        Jornadas
      </button>

      <button
        class="menu-item"
        data-page="assessments"
        type="button"
      >
        <span>✓</span>
        Avaliações
      </button>

      <button
        class="menu-item"
        data-page="pending"
        type="button"
      >
        <span>!</span>
        Pendências

        <span
          id="pendingBadge"
          class="menu-badge hidden"
        >
          0
        </span>
      </button>

      <button
        class="menu-item management-view"
        data-page="indicators"
        type="button"
      >
        <span>▥</span>
        Indicadores
      </button>

      <div class="menu-divider"></div>

      <button
        class="menu-item admin-only"
        data-page="users"
        type="button"
      >
        <span>♙</span>
        Usuários e Acessos
      </button>

      <button
        class="menu-item admin-only"
        data-page="settings"
        type="button"
      >
        <span>⚙</span>
        Configurações
      </button>

    </nav>


    <div class="sidebar-footer">

      <div class="sidebar-profile">

        <div
          id="sidebarUserAvatar"
          class="profile-avatar sidebar-user-avatar"
          data-user-avatar
        >
          U
        </div>

        <div class="profile-info">

          <strong
            id="sidebarUserName"
            class="sidebar-user-name"
            data-user-name
          >
            Carregando...
          </strong>

          <span
            id="sidebarUserRole"
            class="sidebar-user-role profile-role"
            data-user-role
          >
            ...
          </span>

        </div>

      </div>

    </div>

  </aside>


  <!-- ======================================================
       CONTEÚDO
  ======================================================= -->

  <main class="app-main">

    <header class="app-header">

      <div class="header-left">
        <button
          id="sidebarToggle"
          class="icon-button mobile-menu"
          type="button"
        >
          ☰
        </button>

        <div>
          <h1 id="pageTitle">
            Visão Geral
          </h1>

          <p id="pageSubtitle">
            Acompanhe as jornadas dos novos colaboradores.
          </p>
        </div>
      </div>


      <div class="header-actions">
        <button
          id="themeToggleApp"
          class="icon-button"
          title="Alterar tema"
          type="button"
          data-theme-toggle
        >
          🌙
        </button>

        <button
          id="logoutButton"
          class="logout-button"
          type="button"
          data-logout
        >
          Sair
        </button>
      </div>

    </header>


    <section
      id="pageContent"
      class="page-content"
    >
      <div class="page-loading">
        Carregando Shopee Journey...
      </div>
    </section>

  </main>


  <!-- ======================================================
       BIBLIOTECAS / APP
       ORDEM IMPORTANTE:
       config → app → assessments → employees → users → theme → structure → indicadores
  ======================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/assessments.js"></script>
  <script src="js/employees.js?v=20260829-1"></script>
  <script src="js/users.js"></script>
  <script src="js/theme-fix.js"></script>
  <script src="js/settings-structure.js?v=20260829-1"></script>
  <script src="js/indicator-details.js?v=20260829-1"></script>

</body>
</html>
