<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shopee Journey</title>

  <!-- evita 404 inútil de favicon -->
  <link rel="icon" href="data:,">

  <link
    rel="stylesheet"
    href="css/styles.css?v=20260829-2005"
  >
</head>

<body>

  <button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    title="Alterar tema"
  >
    🌙
  </button>


  <main class="login-page">

    <section class="login-card">

      <div class="brand">

        <div class="brand-icon">
          S
        </div>

        <h1>
          Shopee <span>Journey</span>
        </h1>

        <p>
          Jornada de Acompanhamento de Novos Contratados
        </p>

      </div>


      <div class="login-tabs">

        <button
          id="corporateTab"
          class="login-tab active"
          type="button"
        >
          Acesso Corporativo
        </button>

        <button
          id="employeeTab"
          class="login-tab"
          type="button"
        >
          Colaborador
        </button>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label
            id="loginLabel"
            for="login"
          >
            E-mail Shopee
          </label>

          <input
            id="login"
            type="email"
            autocomplete="username"
            placeholder="nome@shopee.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Senha
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            >

            <button
              id="showPassword"
              type="button"
              class="show-password"
              aria-label="Mostrar ou ocultar senha"
            >
              👁
            </button>

          </div>

        </div>


        <div
          id="loginMessage"
          class="login-message"
          aria-live="polite"
        ></div>


        <button
          id="loginButton"
          class="primary-button"
          type="submit"
        >
          Entrar
        </button>

      </form>


      <div class="login-footer">

        <p id="accessHelp">
          Utilize seu e-mail corporativo Shopee.
        </p>

      </div>

    </section>

  </main>


  <!-- Supabase continua disponível para o restante do projeto -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="js/config.js?v=20260829-2005"
  ></script>

  <script
    src="js/auth.js?v=20260829-2005"
  ></script>

</body>
</html>
